<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Monitoramento VIP</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://unpkg.com/esri-leaflet@3.0.10/dist/esri-leaflet.js"></script>
    <script src="https://unpkg.com/esri-leaflet-geocoder@3.1.4/dist/esri-leaflet-geocoder.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/esri-leaflet-geocoder@3.1.4/dist/esri-leaflet-geocoder.css" />
    <style>
        body { margin: 0; padding: 0; background: #121212; font-family: sans-serif; }
        #map { height: 100vh; width: 100%; }
        #info { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 450px; background: rgba(0,0,0,0.95); color: white; padding: 15px; border-radius: 12px; z-index: 9999; text-align: center; border: 2px solid #ff0000; box-shadow: 0 0 20px rgba(255,0,0,0.4); }
    </style>
</head>
<body>
    <div id="info">
        <span id="status" style="color:#ff0000; font-weight:bold; font-size:18px;">📍 AGUARDANDO SINAL...</span><br>
        <span id="endereco" style="color:#bbb; font-size:13px;">Localizando motorista...</span>
        <div id="nome" style="font-size:22px; color:#fff; font-weight:bold; margin-top:10px;">...</div>
    </div>
    <div id="map"></div>
    <script>
        var map = L.map('map', { zoomControl: false }).setView([-15.7975, -47.8919], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        var socket = io(); 
        var markers = {};
        var geocodeService = L.esri.Geocoding.geocodeService();

        socket.on('frota_atualizada', (frota) => {
            Object.keys(frota).forEach(id => {
                var info = frota[id];
                var pos = [info.lat, info.lng];

                if (!markers[id]) {
                    // DESENHA UMA BOLA VERMELHA GIGANTE EM VEZ DE IMAGEM
                    markers[id] = L.circleMarker(pos, {
                        radius: 20,
                        fillColor: "#ff0000",
                        color: "#fff",
                        weight: 3,
                        opacity: 1,
                        fillOpacity: 0.8
                    }).addTo(map);
                    map.flyTo(pos, 16);
                } else {
                    markers[id].setLatLng(pos);
                }

                document.getElementById('status').innerText = "🚨 MOTORISTA LOCALIZADO";
                document.getElementById('nome').innerText = info.usuario.toUpperCase();
                
                geocodeService.reverse().latlng(pos).run(function (error, result) {
                    if (!error && result.address) {
                        document.getElementById('endereco').innerText = result.address.Match_addr;
                    }
                });
            });
        });
    </script>
</body>
</html>
