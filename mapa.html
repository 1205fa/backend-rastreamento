<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Monitoramento VIP</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://unpkg.com/esri-leaflet@3.0.10/dist/esri-leaflet.js"></script>
    <script src="https://unpkg.com/esri-leaflet-geocoder@3.1.4/dist/esri-leaflet-geocoder.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/esri-leaflet-geocoder@3.1.4/dist/esri-leaflet-geocoder.css" />
    <style>
        body { margin: 0; padding: 0; background: #121212; font-family: sans-serif; }
        #map { height: 100vh; width: 100%; }
        
        /* Caixa de Informação do Motorista */
        #info { 
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%); 
            width: 90%; max-width: 450px; 
            background: rgba(0,0,0,0.9); color: white; 
            padding: 15px; border-radius: 12px; z-index: 9999; text-align: center; 
            border: 2px solid #00ffcc; box-shadow: 0 4px 15px rgba(0,255,204,0.3); 
        }

        /* NOVO: Estilo do Contador de Pessoas */
        #contador-box {
            position: absolute; bottom: 20px; left: 20px;
            background: rgba(0,0,0,0.8); color: #00ffcc;
            padding: 10px 15px; border-radius: 30px;
            font-weight: bold; font-size: 14px;
            border: 1px solid #00ffcc; z-index: 9999;
            box-shadow: 0 0 10px rgba(0,255,204,0.2);
        }

        /* Estilo da Bolinha do Emoji */
        .bus-icon-style {
            background-color: #222; border: 2px solid #00ffcc; border-radius: 50%;
            width: 40px !important; height: 40px !important;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 10px #00ffcc; font-size: 20px;
        }
    </style>
</head>
<body>
    <div id="info">
        <span id="status" style="color:#00ffcc; font-weight:bold; font-size:18px;">📍 AGUARDANDO SINAL...</span><br>
        <span id="endereco" style="color:#bbb; font-size:13px;">Localizando motorista...</span>
        <div id="nome" style="font-size:22px; color:#FFD700; font-weight:bold; margin-top:10px;">...</div>
    </div>

    <div id="contador-box">👥 0 Online</div>

    <div id="map"></div>
    
    <script>
        var map = L.map('map', { zoomControl: false }).setView([-15.7975, -47.8919], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // Ícone de Emoji (Indestrutível)
        var iconOnibus = L.divIcon({
            className: 'custom-icon', 
            html: "<div class='bus-icon-style'>🚌</div>", 
            iconSize: [42, 42], iconAnchor: [21, 21]
        });

        var socket = io(); 
        var markers = {};
        var geocodeService = L.esri.Geocoding.geocodeService();

        // LÓGICA DO CONTADOR
        socket.on('atualizar_contador', (numero) => {
            document.getElementById('contador-box').innerText = "👥 " + numero + " Online";
        });

        socket.on('frota_atualizada', (frota) => {
            Object.keys(frota).forEach(id => {
                var info = frota[id];
                var pos = [info.lat, info.lng];

                if (!markers[id]) {
                    markers[id] = L.marker(pos, { icon: iconOnibus }).addTo(map);
                    map.flyTo(pos, 16);
                } else { markers[id].setLatLng(pos); }

                document.getElementById('status').innerText = "📍 ÔNIBUS EM MOVIMENTO";
                document.getElementById('nome').innerText = info.usuario.toUpperCase();
                
                geocodeService.reverse().latlng(pos).run(function (error, result) {
                    if (!error && result.address) {
                        document.getElementById('endereco').innerText = result.address.Match_addr;
                    }
                });
            });
            Object.keys(markers).forEach(id => {
                if (!frota[id]) { map.removeLayer(markers[id]); delete markers[id]; }
            });
        });
    </script>
</body>
</html>
