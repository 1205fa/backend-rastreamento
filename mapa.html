<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Monitoramento VIP</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <script src="https://cdn.socket.io"></script>
    <script src="https://unpkg.com"></script>
    <script src="https://unpkg.com"></script>
    <link rel="stylesheet" href="https://unpkg.com" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Arial', sans-serif; background: #121212; }
        #map { height: 100vh; width: 100%; }
        #info-box { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 450px; background: rgba(0, 0, 0, 0.9); color: white; padding: 15px; border-radius: 15px; z-index: 9999; text-align: center; border: 2px solid #00ffcc; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .tempo { font-size: 18px; font-weight: bold; color: #00ffcc; display: block; }
        .endereco { font-size: 13px; color: #ccc; margin: 5px 0; display: block; height: 16px; }
        .veiculo-nome { font-size: 20px; color: #FFD700; font-weight: 900; text-transform: uppercase; border-top: 1px solid #333; padding-top: 8px; margin-top: 8px; }
    </style>
</head>
<body>
    <div id="info-box">
        <span id="tempo-chegada" class="tempo">SISTEMA ONLINE</span>
        <span id="distancia-chegada" class="endereco">Aguardando sinal...</span>
        <div id="nome-motorista" class="veiculo-nome">AGUARDANDO...</div>
    </div>
    <div id="map"></div>

    <script>
        var map = L.map('map', { zoomControl: false }).setView([-15.7975, -47.8919], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // Ícones Oficiais das 3 Opções
        var icones = {
            'carro': L.icon({ iconUrl: 'https://cdn-icons-png.flaticon.com/512/3082/3082349.png', iconSize: [45, 45], iconAnchor: [22, 22] }),
            'moto': L.icon({ iconUrl: 'https://cdn-icons-png.flaticon.com/512/3448/3448650.png', iconSize: [40, 40], iconAnchor: [20, 20] }),
            'onibus': L.icon({ iconUrl: 'https://cdn-icons-png.flaticon.com/512/2892/2892842.png', iconSize: [50, 50], iconAnchor: [25, 25] })
        };

        var socket = io('https://backend-rastreamento-1.onrender.com');
        var markers = {}; 
        var geocodeService = L.esri.Geocoding.geocodeService();

        socket.on('frota_atualizada', (frota) => {
            Object.keys(frota).forEach(id => {
                var info = frota[id];
                var pos = [info.lat, info.lng];
                var tipo = info.veiculo || 'onibus'; // Pega a escolha do App

                if (!markers[id]) {
                    // Cria o marcador com o ícone escolhido (Ônibus, Carro ou Moto)
                    markers[id] = L.marker(pos, { icon: icones[tipo] || icones['onibus'] }).addTo(map);
                } else {
                    markers[id].setLatLng(pos);
                    markers[id].setIcon(icones[tipo] || icones['onibus']);
                }

                document.getElementById('nome-motorista').innerText = (info.usuario || "Motorista").toUpperCase();
                document.getElementById('tempo-chegada').innerText = "📍 " + tipo.toUpperCase() + " EM MOVIMENTO";

                geocodeService.reverse().latlng(pos).run(function (error, result) {
                    if (!error) document.getElementById('distancia-chegada').innerText = result.address.Match_addr;
                });
            });

            // Limpa quem desligar o sinal
            Object.keys(markers).forEach(id => {
                if (!frota[id]) { map.removeLayer(markers[id]); delete markers[id]; }
            });
        });

        // Bolinha azul do passageiro (Você)
        map.locate({watch: true, enableHighAccuracy: true});
        var markerPassageiro;
        map.on('locationfound', function(e) {
            if (!markerPassageiro) {
                markerPassageiro = L.circleMarker(e.latlng, { radius: 10, color: 'white', fillColor: '#2F80ED', fillOpacity: 0.9, weight: 3 }).addTo(map);
                map.setView(e.latlng, 15);
            } else { markerPassageiro.setLatLng(e.latlng); }
        });
    </script>
</body>
</html>
