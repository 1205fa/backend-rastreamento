<!DOCTYPE html>
<html>
<head>
    <title>Monitoramento VIP</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        #map { height: 100vh; width: 100%; }
        #box { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: black; color: white; padding: 15px; z-index: 1000; border: 2px solid gold; border-radius: 10px; text-align: center; width: 80%; }
    </style>
</head>
<body>
    <div id="box"><b id="status">AGUARDANDO MOTORISTA...</b><br><span id="nome">---</span></div>
    <div id="map"></div>
    <script>
        var map = L.map('map').setView([-15.7975, -47.8919], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        var iconOnibus = L.icon({ iconUrl: 'https://cdn-icons-png.flaticon.com/512/2892/2892842.png', iconSize: [50, 50] });
        var socket = io();
        var markers = {};
        socket.on('frota_atualizada', (frota) => {
            Object.keys(frota).forEach(id => {
                var info = frota[id];
                if (!markers[id]) {
                    markers[id] = L.marker([info.lat, info.lng], {icon: iconOnibus}).addTo(map);
                } else {
                    markers[id].setLatLng([info.lat, info.lng]);
                }
                document.getElementById('status').innerText = "ONIBUS EM MOVIMENTO";
                document.getElementById('nome').innerText = info.usuario;
            });
        });
    </script>
</body>
</html>
