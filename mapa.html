<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Monitoramento VIP</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://unpkg.com/esri-leaflet@3.0.10/dist/esri-leaflet.js"></script>
    <script src="https://unpkg.com/esri-leaflet-geocoder@2.3.3/dist/esri-leaflet-geocoder.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/esri-leaflet-geocoder@2.3.3/dist/esri-leaflet-geocoder.css" />
    <style>
        body { margin: 0; padding: 0; background: #121212; font-family: sans-serif; }
        #map { height: 100vh; width: 100%; }
        #info { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 450px; background: rgba(0,0,0,0.9); color: white; padding: 15px; border-radius: 12px; z-index: 9999; text-align: center; border: 2px solid #00ffcc; }
    </style>
</head>
<body>
    <div id="info">
        <span style="color:#00ffcc; font-weight:bold; font-size:18px;">📍 ÔNIBUS EM MOVIMENTO</span><br>
        <span id="endereco" style="color:#bbb; font-size:13px;">Localizando...</span>
        <div id="nome" style="font-size:22px; color:#FFD700; font-weight:bold; margin-top:10px;">AGUARDANDO...</div>
    </div>
    <div id="map"></div>
    <script>
        var map = L.map('map', { zoomControl: false }).setView([-15.7975, -47.8919], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        var iconOnibus = L.icon({ iconUrl: 'https://cdn-icons-png.flaticon.com/512/2892/2892842.png', iconSize: [50, 50], iconAnchor: [25, 25] });
        var socket = io();
        var markers = {};
        var geocodeService = L.esri.Geocoding.geocodeService();
        socket.on('frota_atualizada', (frota) => {
            Object.keys(frota).forEach(id => {
                var info = frota[id];
                var pos = [info.lat, info.lng];
                if (!markers[id]) {
                    markers[id] = L.marker(pos, { icon: iconOnibus }).addTo(map);
                    map.flyTo(pos, 16);
                } else { markers[id].setLatLng(pos); }
                document.getElementById('nome').innerText = info.usuario.toUpperCase();
                geocodeService.reverse().latlng(pos).run(function (error, result) {
                    if (!error && result.address) { document.getElementById('endereco').innerText = result.address.Match_addr; }
                });
            });
        });
    </script>
</body>
</html>
