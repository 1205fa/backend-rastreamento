<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Monitoramento VIP</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://unpkg.com/esri-leaflet@3.0.10/dist/esri-leaflet.js"></script>
    <script src="https://unpkg.com/esri-leaflet-geocoder@3.1.4/dist/esri-leaflet-geocoder.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/esri-leaflet-geocoder@3.1.4/dist/esri-leaflet-geocoder.css" />

    <style>
        body { margin: 0; padding: 0; font-family: 'Arial', sans-serif; background: #121212; }
        #map { height: 100vh; width: 100%; }
        #info-box { 
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%); 
            width: 90%; max-width: 450px; background: rgba(0, 0, 0, 0.9); 
            color: white; padding: 15px; border-radius: 15px; z-index: 9999; 
            text-align: center; border: 2px solid #00ffcc; box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
        }
        .tempo { font-size: 18px; font-weight: bold; color: #00ffcc; display: block; }
        .endereco { font-size: 13px; color: #ccc; margin: 5px 0; display: block; height: 16px; overflow: hidden; }
        .veiculo-nome { 
            font-size: 20px; color: #FFD700; font-weight: 900; 
            text-transform: uppercase; border-top: 1px solid #333; 
            padding-top: 8px; margin-top: 8px;
        }
    </style>
</head>
<body>
    <div id="info-box">
        <span id="tempo-chegada" class="tempo">SISTEMA ONLINE</span>
        <span id="distancia-chegada" class="endereco">Localizando...</span>
        <div id="nome-motorista" class="veiculo-nome">AGUARDANDO...</div>
    </div>
    <div id="map"></div>

    <script>
        // 1. Configuração do Mapa - Corrigido
        var map = L.map('map', { zoomControl: false }).setView([-15.7975, -47.8919], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // 2. Localização do Passageiro (Bolinha Azul)
        var markerPassageiro;
        map.locate({watch: true, enableHighAccuracy: true});

        map.on('locationfound', function(e) {
            if (!markerPassageiro) {
                markerPassageiro = L.circleMarker(e.latlng, { 
                    radius: 10, color: 'white', fillColor: '#2F80ED', fillOpacity: 0.9, weight: 3 
                }).addTo(map);
                map.setView(e.latlng, 15);
            } else {
                markerPassageiro.setLatLng(e.latlng);
            }
        });

        // 3. Conexão com o Servidor Render
        var socket = io('https://backend-rastreamento-1.onrender.com');
        var markers = {}; 
        var geocodeService = L.esri.Geocoding.geocodeService();

        socket.on('frota_atualizada', (frota) => {
            Object.keys(frota).forEach(id => {
                var info = frota[id];
                var pos = [info.lat, info.lng];
                
                if (!markers[id]) {
                    // Marcador do Motorista (Bolinha Dourada)
                    markers[id] = L.circleMarker(pos, { 
                        radius: 12, color: '#FFD700', fillColor: '#333', fillOpacity: 1, weight: 4 
                    }).addTo(map);
                } else {
                    markers[id].setLatLng(pos);
                }

                document.getElementById('nome-motorista').innerText = (info.usuario || "MOTORISTA").toUpperCase();
                document.getElementById('tempo-chegada').innerText = "📍 EM MOVIMENTO";

                // Geocodificação Reversa
                geocodeService.reverse().latlng(pos).run(function (error, result) {
                    if (!error && result.address) {
                        document.getElementById('distancia-chegada').innerText = result.address.Match_addr;
                    }
                });
            });

            // Limpeza de offline
            Object.keys(markers).forEach(id => {
                if (!frota[id]) {
                    map.removeLayer(markers[id]);
                    delete markers[id];
                    if (Object.keys(markers).length === 0) {
                        document.getElementById('nome-motorista').innerText = "AGUARDANDO...";
                        document.getElementById('distancia-chegada').innerText = "Localizando...";
                        document.getElementById('tempo-chegada').innerText = "SISTEMA ONLINE";
                    }
                }
            });
        });
    </script>
</body>
</html>
