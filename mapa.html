<!DOCTYPE html>
<html>
<head>
    <title>Mapa VIP - Rastreamento</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        #map { height: 100vh; width: 100%; }
        .info-box { position: absolute; top: 10px; right: 10px; background: white; padding: 10px; z-index: 1000; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); font-family: sans-serif; }
    </style>
</head>
<body>
    <div class="info-box">
        <b>Sistema VIP</b><br>
        Pessoas Online: <span id="contador">0</span>
    </div>
    <div id="map"></div>

    <script>
        const map = L.map('map').setView([-15.7942, -47.8822], 13); // Inicia em Brasília
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        const socket = io();
        let marcadores = {};

        socket.on('atualizar_contador', (total) => {
            document.getElementById('contador').innerText = total;
        });

        socket.on('frota_atualizada', (frota) => {
            for (let id in frota) {
                const veiculo = frota[id];
                
                // Texto que vai aparecer no mapa
                const infoText = `<b>${veiculo.usuario}</b><br>Velocidade: ${veiculo.vel} km/h`;

                if (marcadores[id]) {
                    marcadores[id].setLatLng([veiculo.lat, veiculo.lng]);
                    marcadores[id].getPopup().setContent(infoText);
                } else {
                    marcadores[id] = L.marker([veiculo.lat, veiculo.lng])
                        .addTo(map)
                        .bindPopup(infoText)
                        .openPopup();
                }
            }
        });
    </script>
</body>
</html>
