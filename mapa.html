<!DOCTYPE html>
<html>
<head>
    <title>Rastreamento VIP</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: 'Arial', sans-serif; }
        #map { height: 100vh; width: 100%; }
        
        /* CAIXA PRETA FLUTUANTE (ESTILO UBER BLACK) */
        #info-box {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 15px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 9999;
            display: none;
            text-align: center;
            border: 1px solid #333;
        }
        .tempo { font-size: 24px; font-weight: bold; color: #4DFF88; display: block; }
        .distancia { font-size: 14px; color: #ccc; margin-top: 5px; }
        .leaflet-routing-container { display: none !important; }
    </style>
</head>
<body>

    <div id="info-box">
        <span id="tempo-chegada" class="tempo">-- min</span>
        <span id="distancia-chegada" class="distancia">Calculando...</span>
    </div>

    <div id="map"></div>

    <script>
        // MAPA HÍBRIDO (FOTO + RUAS)
        var map = L.map('map', { zoomControl: false }).setView([-15.7975, -47.8919], 15);
        
        L.tileLayer('http://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
        }).addTo(map);

        var iconCarro = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/75/75702.png',
            iconSize: [40, 40],
            iconAnchor: [20, 20]
        });

        var iconUsuario = L.divIcon({
            className: 'custom-icon',
            html: '<div style="background-color:#2F80ED; width:15px; height:15px; border:3px solid white; border-radius:50%; box-shadow:0 0 10px rgba(47,128,237,0.6);"></div>',
            iconSize: [20, 20],
            iconAnchor: [10, 10]
        });

        var socket = io();
        var driverMarker = null;
        var userMarker = null;
        var routeControl = null;
        var driverPos = null;
        var userPos = null;

        map.locate({watch: true, enableHighAccuracy: true});
        
        map.on('locationfound', function(e) {
            userPos = e.latlng;
            if (!userMarker) {
                userMarker = L.marker(e.latlng, {icon: iconUsuario}).addTo(map);
            } else {
                userMarker.setLatLng(e.latlng);
            }
            atualizarRota();
        });

        socket.on('atualizacao', (dados) => {
            var lat, lng;
            if (dados.latitude) { lat = dados.latitude; lng = dados.longitude; }
            else { var k = Object.keys(dados); if(k.length>0){ lat=dados[k[0]].latitude; lng=dados[k[0]].longitude; } }

            if (lat && lng) {
                driverPos = L.latLng(lat, lng);
                if (!driverMarker) { driverMarker = L.marker(driverPos, {icon: iconCarro}).addTo(map); }
                else { driverMarker.setLatLng(driverPos); }
                atualizarRota();
            }
        });

        function atualizarRota() {
            if (userPos && driverPos) {
                document.getElementById('info-box').style.display = 'block';
                if (routeControl) { routeControl.setWaypoints([driverPos, userPos]); }
                else {
                    routeControl = L.Routing.control({
                        waypoints: [driverPos, userPos],
                        show: false,
                        createMarker: function() { return null; },
                        lineOptions: { styles: [{color: '#4DFF88', opacity: 1, weight: 7}] },
                        addWaypoints: false,
                        draggableWaypoints: false,
                        fitSelectedRoutes: true
                    }).addTo(map);

                    routeControl.on('routesfound', function(e) {
                        var s = e.routes[0].summary;
                        var m = Math.round(s.totalTime / 60);
                        var k = (s.totalDistance / 1000).toFixed(1);
                        document.getElementById('tempo-chegada').innerHTML = m + " min <span style='font-size:14px; color:white'>chegando</span>";
                        document.getElementById('distancia-chegada').innerText = k + " km";
                    });
                }
            }
        }
    </script>
</body>
</html>
