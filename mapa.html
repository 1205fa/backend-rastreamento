<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Rastreamento VIP - Satélite</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; background: #121212; font-family: sans-serif; }
        #map { height: 100vh; width: 100%; }

        #info-box {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px;
            background: rgba(0,0,0,0.9); color: white;
            padding: 15px; border-radius: 30px; z-index: 9999; text-align: center;
            border: 2px solid #00ffcc; box-shadow: 0 4px 15px rgba(0,255,204,0.3);
        }
        #tempo-chegada { font-size: 24px; font-weight: bold; color: #FFD700; display: block; margin-top: 5px; }

        #contador {
            position: absolute; bottom: 20px; left: 20px;
            background: black; color: #00ffcc;
            padding: 8px 15px; border-radius: 20px;
            border: 1px solid #00ffcc; font-weight: bold; z-index: 9999;
        }

        .bus-icon {
            background: #222; border: 2px solid #00ffcc; border-radius: 50%;
            width: 45px; height: 45px;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 15px #00ffcc; font-size: 24px;
        }
        .user-dot {
            width: 20px; height: 20px; background-color: #4285F4;
            border-radius: 50%; border: 3px solid white;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(66, 133, 244, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(66, 133, 244, 0); }
            100% { box-shadow: 0 0 0 0 rgba(66, 133, 244, 0); }
        }
        .tooltip-style {
            background: rgba(0,0,0,0.8) !important;
            color: #00ffcc !important;
            border: 1px solid #00ffcc !important;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="info-box">
        <span id="status-texto" style="font-size:14px; color:#bbb;">BUSCANDO MOTORISTAS...</span>
        <span id="tempo-chegada">-- min</span>
    </div>

    <div id="contador">👥 0 Online</div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <script>
        // Configuração dos Mapas
        var mapaRuas = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' });
        var mapaSatelite = L.tileLayer('https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            maxZoom: 20, subdomains:['mt0','mt1','mt2','mt3'], attribution: '© Google Maps'
        });

        var map = L.map('map', { zoomControl: false, layers: [mapaSatelite] }).setView([-15.7942, -47.8822], 14);
        L.control.layers({ "🛰️ Satélite": mapaSatelite, "🗺️ Mapa Ruas": mapaRuas }).addTo(map);

        var socket = io();
        var markers = {};
        var passageiroLat = null, passageiroLng = null, passageiroMarker = null;

        // Ícone do Ônibus (Emoji Blindado)
        var iconOnibus = L.divIcon({
            className: '', 
            html: "<div class='bus-icon'>🚌</div>", 
            iconSize: [45, 45], 
            iconAnchor: [22, 22]
        });

        // Localização do Passageiro (Você)
        map.locate({watch: true, enableHighAccuracy: true});
        map.on('locationfound', function(e) {
            passageiroLat = e.latitude;
            passageiroLng = e.longitude;
            if (!passageiroMarker) {
                var iconPass = L.divIcon({className: '', html: "<div class='user-dot'></div>", iconSize: [20, 20], iconAnchor: [10, 10]});
                passageiroMarker = L.marker([passageiroLat, passageiroLng], {icon: iconPass}).addTo(map);
                map.setView([passageiroLat, passageiroLng], 15);
            } else {
                passageiroMarker.setLatLng([passageiroLat, passageiroLng]);
            }
        });

        // RECEBER ATUALIZAÇÃO DA FROTA
        socket.on('frota_atualizada', (frota) => {
            const idsAtivos = Object.keys(frota);
            document.getElementById('contador').innerText = "👥 " + idsAtivos.length + " Online";

            let encontrouAlguem = false;

            idsAtivos.forEach(id => {
                const info = frota[id];
                // Aceita lat/lng ou latitude/longitude
                const vLat = info.lat || info.latitude;
                const vLng = info.lng || info.longitude;

                if (vLat && vLng) {
                    encontrouAlguem = true;
                    const pos = [vLat, vLng];

                    if (!markers[id]) {
                        markers[id] = L.marker(pos, { icon: iconOnibus }).addTo(map);
                        markers[id].bindTooltip(info.usuario.toUpperCase(), {
                            permanent: true, direction: "top", offset: [0, -25], className: "tooltip-style"
                        });
                    } else {
                        markers[id].setLatLng(pos);
                    }

                    // Cálculo de Tempo e Distância
                    if (passageiroLat && passageiroLng) {
                        const distMetros = map.distance([passageiroLat, passageiroLng], pos);
                        const distKm = (distMetros / 1000).toFixed(1);
                        const tempoMinutos = Math.ceil(distMetros / 450); // Ajuste de velocidade

                        document.getElementById('status-texto').innerText = "MOTORISTA " + info.usuario.toUpperCase() + " A CAMINHO";
                        document.getElementById('tempo-chegada').innerText = tempoMinutos + " min (" + distKm + "km)";
                        document.getElementById('tempo-chegada').style.color = "#00ffcc";
                    }
                }
            });

            // Limpa quem saiu
            Object.keys(markers).forEach(mid => {
                if (!frota[mid]) {
                    map.removeLayer(markers[mid]);
                    delete markers[mid];
                }
            });

            if (!encontrouAlguem) {
                document.getElementById('status-texto').innerText = "AGUARDANDO MOTORISTA...";
                document.getElementById('tempo-chegada').innerText = "-- min";
                document.getElementById('tempo-chegada').style.color = "#FFD700";
            }
        });
    </script>
</body>
</html>
